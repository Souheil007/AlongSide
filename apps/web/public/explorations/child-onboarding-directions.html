    /* ============================================================
       VISUAL 4: THE FAMILY LETTER (CONVERSATIONAL FILL-IN-THE-BLANK)
       ============================================================ */
    function renderDir4() {
      const stage = getStage();
      const name = childDisplayName();
      const age = getAge();

      const nameWidthCh = Math.max(4.5, (state.child.name.trim().length || 4) + 1.4);
      const monthNameLen = MONTHS[state.child.birthMonth - 1].length;
      const monthWidthCh = Math.max(4.8, monthNameLen + 2.3);

      const proseHtml = `
        <div class="v4-prose">
          ${state.ctx === 'add' ? 'We’re also raising' : 'I’m raising'}
          <input class="v4-blank-input" style="width:${nameWidthCh}ch" data-bind="name" value="${state.child.name}" placeholder="name" aria-label="Child first name" />,
          a
          <select class="v4-blank-select" data-bind="gender" aria-label="Boy or girl">
            <option value="FEMALE" ${state.child.gender === 'FEMALE' ? 'selected' : ''}>girl</option>
            <option value="MALE" ${state.child.gender === 'MALE' ? 'selected' : ''}>boy</option>
          </select>
          born in
          <select class="v4-blank-select" style="width:${monthWidthCh}ch" data-bind="birthMonth" aria-label="Birth month">${renderMonthOptions()}</select>
          <select class="v4-blank-select" data-bind="birthYear" aria-label="Birth year" style="font-variant-numeric:tabular-nums">
            ${Array.from({ length: 19 }, (_, i) => CURRENT_YEAR - i).map(y => `<option value="${y}" ${state.child.birthYear === y ? 'selected' : ''}>${y}</option>`).join('')}
          </select>.
          ${age <= 6
            ? `Right now, ${pronounSubj()}’s in the <span style="color:var(--spruce);border-bottom:1.5px dashed var(--spruce-border)">early screen-free years</span>.`
            : `Right now, ${pronounSubj()} <select class="v4-blank-select amber-blank" data-bind="roadType" aria-label="Phone status">
                <option value="PRE_DEVICE" ${state.child.roadType === 'PRE_DEVICE' ? 'selected' : ''}>doesn’t have a phone yet</option>
                <option value="ACTIVE_DEVICE" ${state.child.roadType === 'ACTIVE_DEVICE' ? 'selected' : ''}>already has a smartphone</option>
              </select>.`
          }
        </div>
      `;

      const slipHtml = `
        <div class="v4-slip">
          <div>
            <div class="v4-slip-title">${name} · ${getAgeLabel()} · ${stage.label}</div>
            <div class="v4-slip-text">${stage.insight}</div>
          </div>
          <button type="button" class="btn-spruce" style="white-space:nowrap">
            <span>${state.ctx === 'add' ? `Add ${name} to family` : `Begin ${possessive(name)} edition`}</span>
          </button>
        </div>
      `;

      if (state.ctx === 'add') {
        const modal = `
          <div class="v4-modal-sheet">
            <div class="v4-tabs">
              <div class="v4-tab-list">
                <div class="v4-tab">Leo · 5 yrs</div>
                <div class="v4-tab active">+ New sibling page</div>
              </div>
              <button type="button" class="close-x" style="margin-bottom:6px" aria-label="Close">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <div style="padding:28px 34px 32px">
              <div style="font-size:13px;color:var(--mute)">Tap any highlighted word to fill in ${possessive(name)} details.</div>
              ${proseHtml}
              <div style="margin-top:16px">
                <input class="al-input" style="height:40px;max-width:300px;background:transparent;border-style:dashed" data-bind="schoolGrade" value="${state.child.schoolGrade}" placeholder="+ School or daycare (optional)" />
              </div>
              ${slipHtml}
            </div>
          </div>
        `;
        return renderDashboardBackdrop(modal);
      }

      return `
        ${renderOnboardingTop()}
        <div class="v4-desk">
          <div class="v4-sheet">
            <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--hairline)">
              <div style="display:flex;align-items:center;gap:10px">
                <img src="../brand/alongside-logo-full-256.png" alt="Alongside" style="width:28px;height:28px;border-radius:6px" />
                <div>
                  <div style="font-size:13.5px;font-weight:600;color:var(--ink)">Start your family’s edition</div>
                  <div style="font-size:12px;color:var(--mute)">Tap any highlighted word below — takes 15 seconds.</div>
                </div>
              </div>
              <span style="font-size:12.5px;color:var(--mute)">Ages 0–18</span>
            </div>

            ${proseHtml}

            <div style="margin-top:20px;display:flex;align-items:center;gap:12px">
              <span style="font-size:13px;color:var(--mute)">Optional note:</span>
              <input class="al-input" style="height:38px;max-width:290px;font-size:13.5px;background:#FFF" data-bind="schoolGrade" value="${state.child.schoolGrade}" placeholder="School grade or daycare" />
            </div>

            ${slipHtml}
          </div>
        </div>
      `;
    }

    /* ============================================================
       VISUAL 5: THE LIFESPAN COMPASS (VISUAL 0-18 RIBBON + SCOPED CHIPS)
       ============================================================ */
    function renderDir5() {
      const activeStage = getStage();
      const name = childDisplayName();

      const inner = `
        <div class="v5-top">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
            <div>
              <h2 style="font-family:var(--font-serif);font-size:${state.ctx === 'add' ? '28px' : '34px'};font-weight:400;line-height:1.1;letter-spacing:-0.02em">
                ${state.ctx === 'add' ? 'Place your next child on the timeline' : 'Where is your child on the 0–18 journey?'}
              </h2>
              <p style="font-size:14px;color:var(--body);margin-top:5px">
                ${state.ctx === 'add' ? 'Leo (5) is already calibrated on Early Years. Tap a stage to add a sibling.' : 'Tap their stage first — we’ll narrow down the exact birth year for you.'}
              </p>
            </div>
            ${state.ctx === 'add' ? `<button type="button" class="close-x" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>` : ''}
          </div>

          <div class="v5-ribbon">
            ${STAGES.map(st => {
              const isAct = st.id === activeStage.id;
              const hasLeo = state.ctx === 'add' && st.id === '4-6';
              return `
                <button type="button" class="stage-tile ${isAct ? 'active' : ''}" data-stage-pick="${st.id}">
                  ${hasLeo ? `<span class="sibling-pin">Leo · 5</span>` : ''}
                  <div class="stage-ages">${st.ages}</div>
                  <div class="stage-name">${st.label}</div>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <div class="v5-body">
          <div style="display:flex;flex-direction:column;gap:16px">
            <div>
              <div class="field-label"><span>First name</span></div>
              <input class="al-input" data-bind="name" value="${state.child.name}" placeholder="e.g. Maya" />
            </div>

            <div>
              <div class="field-label"><span>Boy or girl</span></div>
              <div class="gender-seg">
                <button type="button" class="gender-opt ${state.child.gender === 'MALE' ? 'active' : ''}" data-gender="MALE">Boy</button>
                <button type="button" class="gender-opt ${state.child.gender === 'FEMALE' ? 'active' : ''}" data-gender="FEMALE">Girl</button>
              </div>
            </div>

            ${renderPhoneSection(true)}
          </div>

          <div style="display:flex;flex-direction:column;gap:16px">
            <div>
              <div class="field-label">
                <span>Birth year</span>
                <span class="field-hint">Scoped to ${activeStage.label}</span>
              </div>
              <div class="year-chips">
                ${activeStage.years.map(y => `
                  <button type="button" class="y-chip ${state.child.birthYear === y ? 'active' : ''}" data-year-chip="${y}">
                    ${y} <span style="opacity:.6;font-size:12px;margin-left:2px">(${CURRENT_YEAR - y}y)</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="field-label"><span>Birth month</span></div>
              <div class="month-grid-compact">
                ${MONTHS_SHORT.map((m, idx) => `<button type="button" class="m-chip ${state.child.birthMonth === idx + 1 ? 'active' : ''}" data-month="${idx + 1}">${m}</button>`).join('')}
              </div>
            </div>

            <div>
              <div class="field-label"><span>School or daycare</span><span class="field-hint">Optional</span></div>
              <input class="al-input" style="height:42px" data-bind="schoolGrade" value="${state.child.schoolGrade}" placeholder="e.g. 5th Grade" />
            </div>
          </div>
        </div>

        <div class="v5-foot">
          <div class="v5-summary-pill">
            <span style="width:10px;height:10px;border-radius:999px;background:var(--spruce)"></span>
            <span><strong>${name}</strong> · ${getAgeLabel()} · ${activeStage.label} — starts with <strong>${activeStage.nextStep}</strong></span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
            ${state.ctx === 'add' ? `<button type="button" class="btn-ghost">Cancel</button>` : ''}
            <button type="button" class="btn-spruce">
              <span>${state.ctx === 'add' ? `Add ${name}` : `Create ${possessive(name)} profile`}</span>
            </button>
          </div>
        </div>
      `;

      if (state.ctx === 'add') {
        return renderDashboardBackdrop(`<div class="v5-modal">${inner}</div>`);
      }

      return `
        ${renderOnboardingTop()}
        <div class="v5-wrap">
          <div class="v5-panel">${inner}</div>
        </div>
      `;
    }

    /* ============================================================
       MAIN RENDER & EVENT BINDINGS
       ============================================================ */
    function render() {
      const frame = document.getElementById('stage-frame');
      frame.classList.toggle('mobile-mode', state.view === 'mobile');

      // Update studio topbar controls
      document.querySelectorAll('[data-dir]').forEach(btn => {
        const d = Number(btn.dataset.dir);
        btn.classList.remove('active', 'active-before');
        if (d === state.dir) btn.classList.add(d === 0 ? 'active-before' : 'active');
      });
      document.querySelectorAll('[data-ctx]').forEach(btn => {
        btn.classList.toggle('active-ctx', btn.dataset.ctx === state.ctx);
      });
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === state.view);
      });

      const m = META[state.dir];
      document.getElementById('meta-code').textContent = m.code;
      document.getElementById('meta-title').textContent = m.title;
      document.getElementById('meta-desc').textContent = m.desc;

      let html = '';
      if (state.dir === 0) html = renderDir0();
      else if (state.dir === 1) html = renderDir1();
      else if (state.dir === 2) html = renderDir2();
      else if (state.dir === 3) html = renderDir3();
      else if (state.dir === 4) html = renderDir4();
      else if (state.dir === 5) html = renderDir5();

      frame.innerHTML = html;
      bindStageEvents();
    }

    function bindStageEvents() {
      const frame = document.getElementById('stage-frame');

      frame.querySelectorAll('[data-bind="name"]').forEach(el => {
        el.addEventListener('input', e => {
          const pos = e.target.selectionStart;
          state.child.name = e.target.value;
          render();
          const next = frame.querySelector('[data-bind="name"]');
          if (next) { next.focus(); next.setSelectionRange(pos, pos); }
        });
      });

      frame.querySelectorAll('[data-bind="schoolGrade"]').forEach(el => {
        el.addEventListener('input', e => {
          state.child.schoolGrade = e.target.value;
        });
      });

      frame.querySelectorAll('[data-bind="birthMonth"]').forEach(el => {
        el.addEventListener('change', e => { state.child.birthMonth = Number(e.target.value); render(); });
      });
      frame.querySelectorAll('[data-bind="birthYear"]').forEach(el => {
        el.addEventListener('change', e => { state.child.birthYear = Number(e.target.value); state.overrideEarlyPhone = false; render(); });
      });
      frame.querySelectorAll('[data-bind="gender"]').forEach(el => {
        el.addEventListener('change', e => { state.child.gender = e.target.value; render(); });
      });
      frame.querySelectorAll('[data-bind="roadType"]').forEach(el => {
        el.addEventListener('change', e => { state.child.roadType = e.target.value; render(); });
      });

      frame.querySelectorAll('[data-gender]').forEach(btn => {
        btn.addEventListener('click', () => { state.child.gender = btn.dataset.gender; render(); });
      });
      frame.querySelectorAll('[data-road]').forEach(btn => {
        btn.addEventListener('click', () => { state.child.roadType = btn.dataset.road; render(); });
      });
      frame.querySelectorAll('[data-month]').forEach(btn => {
        btn.addEventListener('click', () => { state.child.birthMonth = Number(btn.dataset.month); render(); });
      });
      frame.querySelectorAll('[data-year-chip]').forEach(btn => {
        btn.addEventListener('click', () => { state.child.birthYear = Number(btn.dataset.yearChip); state.overrideEarlyPhone = false; render(); });
      });
      frame.querySelectorAll('[data-stage-pick]').forEach(btn => {
        btn.addEventListener('click', () => {
          const st = STAGES.find(s => s.id === btn.dataset.stagePick);
          if (st) {
            state.child.birthYear = st.defaultYear;
            state.overrideEarlyPhone = false;
            if (st.id === '13-18') state.child.roadType = 'ACTIVE_DEVICE';
            else if (st.id === '0-3' || st.id === '4-6') state.child.roadType = 'PRE_DEVICE';
            render();
          }
        });
      });
      frame.querySelectorAll('[data-v2step]').forEach(btn => {
        btn.addEventListener('click', () => { state.v2Step = Number(btn.dataset.v2step); render(); });
      });
      frame.querySelectorAll('[data-age-delta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const delta = Number(btn.dataset.ageDelta);
          const nextAge = Math.min(18, Math.max(0, getAge() + delta));
          state.child.birthYear = CURRENT_YEAR - nextAge;
          state.overrideEarlyPhone = false;
          render();
        });
      });
      frame.querySelectorAll('[data-action="toggle-opt"]').forEach(btn => {
        btn.addEventListener('click', () => { state.showOptional = !state.showOptional; render(); });
      });
      frame.querySelectorAll('[data-action="override-phone"]').forEach(btn => {
        btn.addEventListener('click', () => { state.overrideEarlyPhone = true; render(); });
      });
    }

    // Studio chrome controls
    document.querySelectorAll('[data-dir]').forEach(btn => {
      btn.addEventListener('click', () => { state.dir = Number(btn.dataset.dir); render(); });
    });
    document.querySelectorAll('[data-ctx]').forEach(btn => {
      btn.addEventListener('click', () => { state.ctx = btn.dataset.ctx; render(); });
    });
    document.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => { state.view = btn.dataset.view; render(); });
    });
    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
    });

    // Keyboard shortcuts 0-5 for fast browsing
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (['0','1','2','3','4','5'].includes(e.key)) {
        state.dir = Number(e.key);
        render();
      }
    });

    render();
  </script>
</body>
</html>
