      // Update tabs
      ['julian', 'maya', 'mateo'].forEach(k => {
        const btn = document.getElementById(`tab-${k}`);
        if (k === childKey) {
          btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-spruce bg-spruce-soft text-spruce font-mono text-xs font-semibold shadow-2xs transition";
        } else {
          btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-hairline bg-transparent text-body font-mono text-xs hover:bg-canvas-subtle transition";
        }
      });

      renderSlide();
    }

    function renderSlide() {
      const slides = REELS_DATA[currentChild];
      const slide = slides[currentSlide];

      // Update Progress bars
      for (let i = 0; i < 5; i++) {
        const bar = document.getElementById(`prog-${i}`);
        if (i < currentSlide) {
          bar.style.width = '100%';
        } else if (i === currentSlide) {
          bar.style.width = '100%';
        } else {
          bar.style.width = '0%';
        }
      }

      // Update indicator
      document.getElementById('slide-indicator').textContent = `Story ${currentSlide + 1} of ${slides.length}`;

      // Update Back / Next buttons
      document.getElementById('btn-prev').disabled = currentSlide === 0;
      const nextBtn = document.getElementById('btn-next');
      if (currentSlide === slides.length - 1) {
        nextBtn.innerHTML = `<span>Finish</span>`;
      } else {
        nextBtn.innerHTML = `<span>Next</span><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>`;
      }

      // Render content
      const container = document.getElementById('slide-content');
      container.className = "flex-1 p-6 sm:p-8 flex flex-col justify-between slide-enter z-10 bg-[#FAF9F6]";
      container.innerHTML = `
        <div class="space-y-1">
          <span class="font-mono text-[10px] uppercase tracking-wider text-amber font-bold">${slide.badge}</span>
          <h2 class="font-mono text-xs text-mute uppercase tracking-wider font-semibold">${slide.title}</h2>
        </div>
        ${slide.content}
        <div class="text-[10px] font-mono text-mute pt-2 border-t border-hairline flex items-center justify-between">
          <span>AlongSide Sunday Culture Reel</span>
          <span>Calibrated: ${currentChild.toUpperCase()}</span>
        </div>
      `;
    }

    function nextSlide() {
      const slides = REELS_DATA[currentChild];
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      } else {
        currentSlide = 0;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function handleQuiz(option) {
      const fb = document.getElementById('quiz-feedback');
      fb.classList.remove('hidden');
      if (option === 2) {
        fb.className = "p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs space-y-1";
        fb.innerHTML = `<strong>✨ Correct!</strong> You nailed it. Prefrontal impulse control drops in peer situations, triggering emotional eruption.`;
      } else {
        fb.className = "p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 text-xs space-y-1";
        fb.innerHTML = `<strong>Close!</strong> The true answer is emotional blowup under acute peer stress.`;
      }
    }

    function copyReelPrompt() {
      const btn = document.getElementById('btn-reel-copy');
      navigator.clipboard.writeText("Tonight's Sunday Table prompt copied!");
      const orig = btn.innerHTML;
      btn.innerHTML = `<span>Copied to Clipboard!</span>`;
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    // Default to Julian
    setChild('julian');
  </script>
</body>
</html>
